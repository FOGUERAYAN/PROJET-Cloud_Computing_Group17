name: CI Application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatage (ruff format)
        run: ruff format --check .

      - name: Tests (pytest)
        run: |
          set +e
          pytest -q
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::warning::Aucun test trouvé pour l'instant."
            exit 0
          fi
          exit "$code"

  docker-build:
    name: docker-build
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Construction de l'image Docker
        if: hashFiles('Dockerfile') != ''
        run: docker build --tag cap90:${{ github.sha }} .

      - name: Pas encore de Dockerfile
        if: hashFiles('Dockerfile') == ''
        run: echo "::notice::Aucun Dockerfile pour l'instant, build ignoré."

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Récupération de tout l'historique
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Détection de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
