name: CI Application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # requirements-dev.txt inclut requirements.txt et fixe les versions de ruff, pytest et pillow.
      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatage (ruff format)
        run: ruff format --check .

      # Aucun test collecté (code 5) fait échouer le job : la suite doit toujours s'exécuter.
      - name: Tests (pytest)
        run: pytest -q

  docker-build:
    name: docker-build
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Construction de l'image Docker
        run: docker build --tag cap90:${{ github.sha }} .

      - name: Vérification de l'utilisateur non root
        run: |
          user=$(docker inspect --format '{{.Config.User}}' cap90:${{ github.sha }})
          echo "Utilisateur de l'image : ${user:-root}"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"

      - name: Test de démarrage (GET /health)
        run: |
          docker run -d --name cap90 -p 8000:8000 \
            -e SECRET_KEY=ci-secret-sans-valeur -e STORAGE_MODE=memoire \
            cap90:${{ github.sha }}
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          docker logs cap90
          exit 1

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Récupération de tout l'historique
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Détection de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
